# 合并到主分支后构建静态站，发布到 GitHub Pages
name: 发布
on:
  push:
    branches: [main]
    paths:
      - "content/**"
      - "site/**"
      - "scripts/build.mjs"
      - "scripts/lib/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build.mjs
        env:
          WG_SITE_URL: ${{ vars.WG_SITE_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
