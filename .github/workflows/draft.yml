# 每天几次：挑分数最高、还没写过的候选，让模型写稿，每篇开一个 PR 等人审核
name: 写稿
on:
  schedule:
    - cron: "17 0,4,8,12 * * *"     # UTC，即北京时间 8:17 / 12:17 / 16:17 / 20:17
  workflow_dispatch:
    inputs:
      top:
        description: 写几篇（不填就用变量 WG_DRAFT_TOP，默认 1）
        default: ""
      id:
        description: 指定候选 ID（可选，见 data 分支的 candidates.md）
        default: ""
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: data-writer
  cancel-in-progress: false
jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bash scripts/ci/ensure-data-branch.sh
      - uses: actions/checkout@v4
        with:
          ref: data
          path: data
      - name: 写稿
        env:
          WG_PROVIDER: ${{ vars.WG_PROVIDER }}          # xai（默认，Grok）或 anthropic（Claude）
          WG_MODEL: ${{ vars.WG_MODEL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: |
          if [ -n "${{ inputs.id }}" ]; then
            node scripts/draft.mjs --id "${{ inputs.id }}"
          else
            node scripts/draft.mjs --top "${{ inputs.top || vars.WG_DRAFT_TOP || '1' }}"
          fi
      - name: 开 PR
        env:
          # 用 GITHUB_TOKEN 开的 PR 不会触发「校验」工作流；配了 WG_BOT_TOKEN（机器人账号的令牌）就会
          GH_TOKEN: ${{ secrets.WG_BOT_TOKEN || secrets.GITHUB_TOKEN }}
        run: bash scripts/open-prs.sh
