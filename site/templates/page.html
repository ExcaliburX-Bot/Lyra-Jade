<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESC}}">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESC}}">
<link rel="alternate" type="application/rss+xml" title="玲珑玉 Lyra-Jade" href="{{BASE}}rss.xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{BASE}}assets/site.css">
<script>(function(){try{var m=JSON.parse(localStorage.getItem("wg-prefs")||"{}").theme||"dark";if(m==="light"||(m==="system"&&!matchMedia("(prefers-color-scheme: dark)").matches))document.documentElement.classList.remove("dark")}catch(e){}})()</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%2210%22 fill=%22%23f5b301%22/%3E%3C/svg%3E">
</head>
<body class="{{BODYCLASS}}">

<!-- ============ 侧栏 ============ -->
<aside class="side" aria-label="栏目">
  <div class="side-head">
    <a class="logo" href="{{BASE}}index.html" data-home><span class="logo-mark">玉</span><span>玲珑玉 <b>Lyra-Jade</b></span></a>
    <button class="icon-btn" id="closeSide" aria-label="收起侧栏"><svg class="i"><use href="#i-panel"/></svg></button>
  </div>
  <button class="side-search" data-open-search><svg class="i"><use href="#i-search"/></svg><span data-t="searchOrAsk"></span><kbd>⌘K</kbd></button>
  <nav class="side-nav" id="sideNav"></nav>
  <div class="side-foot">
    <button class="btn btn-light btn-block" data-open-login><svg class="i"><use href="#i-user"/></svg><span data-t="loginSignup"></span></button>
    <p data-t="syncHint"></p>
  </div>
</aside>
<div class="side-scrim" id="sideScrim"></div>

<!-- ============ 顶栏 ============ -->
<header class="top">
  <div class="crumb">
    <button class="icon-btn open-side" id="openSide" aria-label="展开侧栏"><svg class="i"><use href="#i-menu"/></svg></button>
    <a href="{{BASE}}index.html" data-home class="hide-sm">玲珑玉</a><span class="hide-sm">/</span><b data-t="navJiedu"></b>
  </div>
  <button class="icon-btn" data-open-search aria-label="搜索"><svg class="i"><use href="#i-search"/></svg></button>
  <a class="top-link hide-sm" href="#" data-todo><span class="v">v1</span><span data-t="changelog"></span></a>
  <div class="theme-wrap">
    <button class="icon-btn" id="themeBtn" aria-label="深浅色"><svg class="i"><use href="#i-contrast"/></svg></button>
    <div class="menu" id="themeMenu">
      <button data-theme="system"><svg class="i"><use href="#i-contrast"/></svg><span><span data-t="themeSystem"></span><small id="sysNow"></small></span><i class="dot"></i></button>
      <button data-theme="light"><svg class="i"><use href="#i-sun"/></svg><span data-t="themeLight"></span><i class="dot"></i></button>
      <button data-theme="dark"><svg class="i"><use href="#i-moon"/></svg><span data-t="themeDark"></span><i class="dot"></i></button>
      <div class="note" data-t="themeNote"></div>
    </div>
  </div>
  <div class="lang" role="group" aria-label="Language">
    <button data-lang="zh">中</button><button data-lang="en">EN</button><button data-lang="ja">日</button>
  </div>
  <button class="top-link hide-sm" data-open-login data-t="login"></button>
  <a class="top-link rose hide-sm" href="#" data-todo data-t="member"></a>
  <button class="btn btn-light" data-subscribe data-t="subscribe"></button>
</header>

<main>
{{MAIN}}
  <footer>
    <div class="wrap foot">
      <div><a class="logo" href="{{BASE}}index.html" data-home><span class="logo-mark">玉</span><span>玲珑玉 <b>Lyra-Jade</b></span></a><p data-t="footTag"></p></div>
      <div><h5 data-t="grpDaily"></h5><ul id="fDaily"></ul></div>
      <div><h5 data-t="grpLearn"></h5><ul id="fLearn"></ul></div>
      <div><h5 data-t="grpCoop"></h5><ul id="fCoop"></ul></div>
    </div>
    <div class="wrap foot-bar">
      <span>© 2026 玲珑玉 Lyra-Jade · <span data-t="footMotto"></span></span>
      <nav><a href="#" data-todo data-t="member"></a><a href="#" data-subscribe data-t="subscribe"></a><a href="#" data-open-search data-t="search"></a><a href="#" data-todo data-t="submit"></a><a href="#" data-todo>RSS</a><a href="#" data-todo data-t="podFeed"></a></nav>
    </div>
  </footer>
</main>

<button class="totop" id="toTop" aria-label="回到顶部"><svg class="i"><use href="#i-up"/></svg></button>
<div class="toast" id="toast"></div>

<!-- ============ 登录弹窗 ============ -->
<div class="scrim" id="loginScrim">
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="loginTitle">
    <button class="icon-btn x" data-close aria-label="关闭"><svg class="i"><use href="#i-x"/></svg></button>
    <div class="over">ACCOUNT</div>
    <h3 id="loginTitle" data-t="login"></h3>
    <div class="tabs"><button class="on" data-tab="in" data-t="login"></button><button data-tab="up" data-t="signupFree"></button></div>
    <button class="btn btn-rose" data-fake><svg class="i"><use href="#i-google"/></svg><span data-t="google"></span></button>
    <div class="or" data-t="orEmail"></div>
    <form id="loginForm">
      <input class="field" type="email" required data-ph="emailPh">
      <input class="field" type="password" id="pwd" data-ph="pwdPh">
      <button class="btn btn-ghost" type="submit" id="loginSubmit" data-t="login"></button>
      <button class="btn btn-ghost" type="button" data-fake data-t="magic"></button>
    </form>
    <div class="tip" id="loginTip"></div>
    <div class="dlinks"><a href="#" data-tabto="up" data-t="noAccount"></a><a href="#" data-fake data-t="redeem"></a></div>
  </div>
</div>

<!-- ============ 搜索弹窗 ============ -->
<div class="scrim" id="searchScrim">
  <div class="dialog search-dialog" role="dialog" aria-modal="true" aria-label="搜索">
    <div class="sbar"><svg class="i"><use href="#i-search"/></svg><input id="sq" autocomplete="off" data-ph="searchPh"><kbd>ESC</kbd></div>
    <div class="sres" id="sres"></div>
    <div class="sfoot"><span>↑↓ <span data-t="kNav"></span></span><span>↵ <span data-t="kOpen"></span></span><span>ESC <span data-t="kClose"></span></span></div>
  </div>
</div>

<!-- ============ 图标 ============ -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
  <symbol id="i-panel" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></symbol>
  <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></symbol>
  <symbol id="i-contrast" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3v18a9 9 0 0 0 0-18Z" fill="currentColor"/></symbol>
  <symbol id="i-gem" viewBox="0 0 24 24"><path d="M6 3h12l4 6-10 12L2 9Z"/><path d="M2 9h20M12 21 8 9l4-6 4 6-4 12"/></symbol>
  <symbol id="i-book" viewBox="0 0 24 24"><path d="M2 5a2 2 0 0 1 2-2h5a3 3 0 0 1 3 3v15a2 2 0 0 0-2-2H2ZM22 5a2 2 0 0 0-2-2h-5a3 3 0 0 0-3 3v15a2 2 0 0 1 2-2h8Z"/></symbol>
  <symbol id="i-news" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 7h8M8 11h8M8 15h5"/></symbol>
  <symbol id="i-cal" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></symbol>
  <symbol id="i-layers" viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5Z"/><path d="m3 13 9 5 9-5"/></symbol>
  <symbol id="i-head" viewBox="0 0 24 24"><path d="M3 15v-3a9 9 0 0 1 18 0v3"/><rect x="3" y="14" width="5" height="7" rx="2"/><rect x="16" y="14" width="5" height="7" rx="2"/></symbol>
  <symbol id="i-cap" viewBox="0 0 24 24"><path d="m2 9 10-5 10 5-10 5Z"/><path d="M6 11v5c0 1.5 3 3 6 3s6-1.5 6-3v-5"/></symbol>
  <symbol id="i-bulb" viewBox="0 0 24 24"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3Z"/></symbol>
  <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></symbol>
  <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M5.6 5.6l2.8 2.8M15.6 15.6l2.8 2.8M5.6 18.4l2.8-2.8M15.6 8.4l2.8-2.8"/></symbol>
  <symbol id="i-brief" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2M3 13h18"/></symbol>
  <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 5 5 9-10"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M3 12h3l3-7 4 14 3-7h5"/></symbol>
  <symbol id="i-chev-l" viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></symbol>
  <symbol id="i-chev-r" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
  <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
  <symbol id="i-chat" viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12Z"/></symbol>
  <symbol id="i-google" viewBox="0 0 24 24"><path d="M21 12.2c0-.7-.1-1.3-.2-1.9H12v3.6h5a4.3 4.3 0 0 1-1.9 2.8v2.3h3A9 9 0 0 0 21 12.2Z"/><path d="M12 21a8.9 8.9 0 0 0 6.1-2.2l-3-2.3a5.6 5.6 0 0 1-8.3-2.9H3.7v2.4A9 9 0 0 0 12 21Z"/><path d="M6.8 13.6a5.4 5.4 0 0 1 0-3.4V7.8H3.7a9 9 0 0 0 0 8.2Z"/><path d="M12 6.6c1.4 0 2.6.5 3.6 1.4l2.7-2.7A9 9 0 0 0 3.7 7.8l3.1 2.4A5.4 5.4 0 0 1 12 6.6Z"/></symbol>
</svg>

<script>window.SITE_BASE="{{BASE}}";window.SITE_DATA={{DATA}};</script>
<script src="{{BASE}}assets/app.js"></script>
<script type="module">import {initFigures} from "{{BASE}}assets/components.js";initFigures(document);</script>
</body>
</html>
